<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1440" viewBox="0 0 3840 1440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <style>
      .laneTitle{font:700 30px Arial,sans-serif;fill:#18212b}.phase{font:700 20px Arial,sans-serif;fill:#45617d;letter-spacing:1px}
      .node{fill:#d9ebff;stroke:#2867ad;stroke-width:3}.nodeText{font:600 19px Arial,sans-serif;fill:#101820;text-anchor:middle}
      .decision{fill:#fff;stroke:#263238;stroke-width:3}.decisionText{font:600 18px Arial,sans-serif;fill:#101820;text-anchor:middle}
      .flow{fill:none;stroke:#263238;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}.guard{font:italic 18px Arial,sans-serif;fill:#111}
      .note{font:18px Arial,sans-serif;fill:#243746}.small{font:16px Arial,sans-serif;fill:#243746}
    </style>
  </defs>

  <rect width="3840" height="1440" fill="#fff"/>
  <text x="1920" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Activity Diagram – Grade Submission</text>

  <!-- Swimlanes -->
  <rect x="20" y="90" width="3800" height="390" fill="#edf5ff" stroke="#263238" stroke-width="3"/>
  <rect x="20" y="480" width="3800" height="580" fill="#f3f8ef" stroke="#263238" stroke-width="3"/>
  <rect x="20" y="1060" width="3800" height="270" fill="#fff4e8" stroke="#263238" stroke-width="3"/>
  <line x1="190" y1="90" x2="190" y2="1330" stroke="#263238" stroke-width="3"/>
  <text class="laneTitle" x="105" y="265" text-anchor="middle"><tspan x="105">Teaching</tspan><tspan x="105" dy="36">Staff</tspan></text>
  <text class="laneTitle" x="105" y="730" text-anchor="middle"><tspan x="105">Student</tspan><tspan x="105" dy="36">Scholar</tspan></text>
  <text class="laneTitle" x="105" y="1160" text-anchor="middle"><tspan x="105">Similarity-</tspan><tspan x="105" dy="36">Checking</tspan><tspan x="105" dy="36">Service</tspan></text>

  <!-- Phase captions -->
  <text class="phase" x="440" y="125" text-anchor="middle">ACCESS</text>
  <text class="phase" x="1000" y="125" text-anchor="middle">SELECT &amp; LOAD</text>
  <text class="phase" x="1690" y="125" text-anchor="middle">REVIEW &amp; SIMILARITY</text>
  <text class="phase" x="2600" y="125" text-anchor="middle">RUBRIC GRADING LOOP</text>
  <text class="phase" x="3490" y="125" text-anchor="middle">SAVE DRAFT</text>

  <!-- ACCESS -->
  <circle cx="240" cy="230" r="17" fill="#111"/>
  <rect class="node" x="290" y="190" width="145" height="80" rx="22"/>
  <text class="nodeText" x="362" y="237">Sign in</text>
  <path class="flow" d="M257 230 H290"/>
  <rect class="node" x="300" y="580" width="240" height="92" rx="22"/>
  <text class="nodeText" x="420" y="615"><tspan x="420">Verify identity and</tspan><tspan x="420" dy="25">course assignment</tspan></text>
  <path class="flow" d="M362 270 V580"/>
  <polygon class="decision" points="630,570 700,626 630,682 560,626"/>
  <text class="decisionText" x="630" y="619"><tspan x="630">Staff</tspan><tspan x="630" dy="22">authorised?</tspan></text>
  <path class="flow" d="M540 626 H560"/>
  <rect class="node" x="515" y="795" width="230" height="84" rx="22"/>
  <text class="nodeText" x="630" y="830"><tspan x="630">Display access</tspan><tspan x="630" dy="25">error</tspan></text>
  <path class="flow" d="M630 682 V795"/>
  <text class="guard" x="646" y="742">[not authorised]</text>
  <circle cx="805" cy="837" r="31" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="805" cy="837" r="19" fill="#111"/>
  <path class="flow" d="M745 837 H774"/>

  <!-- selection -->
  <rect class="node" x="760" y="190" width="185" height="80" rx="22"/>
  <text class="nodeText" x="852" y="222"><tspan x="852">Select assigned</tspan><tspan x="852" dy="25">course</tspan></text>
  <rect class="node" x="970" y="190" width="165" height="80" rx="22"/>
  <text class="nodeText" x="1052" y="222"><tspan x="1052">Select</tspan><tspan x="1052" dy="25">assessment</tspan></text>
  <rect class="node" x="1160" y="190" width="190" height="80" rx="22"/>
  <text class="nodeText" x="1255" y="222"><tspan x="1255">Select student</tspan><tspan x="1255" dy="25">submission</tspan></text>
  <path class="flow" d="M700 626 H725 V230 H760"/>
  <text class="guard" x="710" y="600">[authorised]</text>
  <path class="flow" d="M945 230 H970"/><path class="flow" d="M1135 230 H1160"/>

  <!-- fork/load/join -->
  <rect x="1190" y="530" width="240" height="12" rx="3" fill="#111"/>
  <path class="flow" d="M1255 270 V530"/>
  <rect class="node" x="1160" y="600" width="170" height="90" rx="22"/>
  <text class="nodeText" x="1245" y="632"><tspan x="1245">Retrieve</tspan><tspan x="1245" dy="24">submission content</tspan></text>
  <rect class="node" x="1350" y="600" width="160" height="90" rx="22"/>
  <text class="nodeText" x="1430" y="632"><tspan x="1430">Load assessment</tspan><tspan x="1430" dy="24">rubric</tspan></text>
  <path class="flow" d="M1245 542 V600"/><path class="flow" d="M1430 542 V600"/>
  <rect x="1190" y="745" width="320" height="12" rx="3" fill="#111"/>
  <path class="flow" d="M1245 690 V745"/><path class="flow" d="M1430 690 V745"/>
  <rect class="node" x="1280" y="800" width="200" height="85" rx="22"/>
  <text class="nodeText" x="1380" y="833"><tspan x="1380">Display grading</tspan><tspan x="1380" dy="25">workspace</tspan></text>
  <path class="flow" d="M1350 757 V800"/>

  <!-- review and optional similarity -->
  <rect class="node" x="1465" y="190" width="170" height="80" rx="22"/>
  <text class="nodeText" x="1550" y="222"><tspan x="1550">Review</tspan><tspan x="1550" dy="25">submission</tspan></text>
  <path class="flow" d="M1480 842 H1550 V270"/>
  <polygon class="decision" points="1740,170 1820,230 1740,290 1660,230"/>
  <text class="decisionText" x="1740" y="218"><tspan x="1740">Request similarity</tspan><tspan x="1740" dy="22">check?</tspan></text>
  <path class="flow" d="M1635 230 H1660"/>
  <rect class="node" x="1630" y="585" width="220" height="88" rx="22"/>
  <text class="nodeText" x="1740" y="618"><tspan x="1740">Send similarity-check</tspan><tspan x="1740" dy="25">request</tspan></text>
  <path class="flow" d="M1740 290 V585"/><text class="guard" x="1755" y="350">[requested]</text>
  <rect class="node" x="1615" y="1145" width="235" height="88" rx="22"/>
  <text class="nodeText" x="1732" y="1178"><tspan x="1732">Analyse submitted</tspan><tspan x="1732" dy="25">content</tspan></text>
  <rect class="node" x="1880" y="1145" width="220" height="88" rx="22"/>
  <text class="nodeText" x="1990" y="1178"><tspan x="1990">Return similarity</tspan><tspan x="1990" dy="25">report</tspan></text>
  <path class="flow" d="M1740 673 V1145"/><path class="flow" d="M1850 1189 H1880"/>
  <rect class="node" x="1880" y="585" width="220" height="88" rx="22"/>
  <text class="nodeText" x="1990" y="618"><tspan x="1990">Display similarity</tspan><tspan x="1990" dy="25">report</tspan></text>
  <path class="flow" d="M1990 1145 V673"/>
  <rect class="node" x="1880" y="340" width="220" height="82" rx="22"/>
  <text class="nodeText" x="1990" y="372"><tspan x="1990">Review similarity</tspan><tspan x="1990" dy="25">report</tspan></text>
  <path class="flow" d="M1990 585 V422"/>
  <polygon class="decision" points="2140,216 2158,234 2140,252 2122,234"/>
  <path class="flow" d="M2100 381 H2140 V252"/>
  <path class="flow" d="M1820 230 H2122"/><text class="guard" x="1870" y="212">[skipped]</text>

  <!-- rubric grading loop -->
  <rect class="node" x="2190" y="190" width="220" height="85" rx="22"/>
  <text class="nodeText" x="2300" y="222"><tspan x="2300">Enter criterion mark</tspan><tspan x="2300" dy="25">and comment</tspan></text>
  <path class="flow" d="M2158 234 H2190"/>
  <polygon class="decision" points="2510,172 2580,232 2510,292 2440,232"/>
  <text class="decisionText" x="2510" y="220"><tspan x="2510">Custom mark</tspan><tspan x="2510" dy="22">used?</tspan></text>
  <path class="flow" d="M2410 232 H2440"/>
  <rect class="node" x="2635" y="145" width="225" height="82" rx="22"/>
  <text class="nodeText" x="2747" y="176"><tspan x="2747">Enter custom-mark</tspan><tspan x="2747" dy="25">justification</tspan></text>
  <path class="flow" d="M2580 208 H2635"/><text class="guard" x="2585" y="188">[custom mark]</text>
  <polygon class="decision" points="2920,218 2938,236 2920,254 2902,236"/>
  <path class="flow" d="M2860 186 H2920 V218"/>
  <path class="flow" d="M2510 292 V325 H2920 V254"/><text class="guard" x="2630" y="315">[standard rubric mark]</text>
  <rect class="node" x="2800" y="555" width="240" height="86" rx="22"/>
  <text class="nodeText" x="2920" y="588"><tspan x="2920">Validate criterion</tspan><tspan x="2920" dy="25">information</tspan></text>
  <path class="flow" d="M2920 254 V555"/>
  <polygon class="decision" points="2920,690 3010,750 2920,810 2830,750"/>
  <text class="decisionText" x="2920" y="738"><tspan x="2920">Criterion information</tspan><tspan x="2920" dy="22">valid?</tspan></text>
  <path class="flow" d="M2920 641 V690"/>
  <rect class="node" x="3120" y="705" width="205" height="86" rx="22"/>
  <text class="nodeText" x="3222" y="738"><tspan x="3222">Display validation</tspan><tspan x="3222" dy="25">error</tspan></text>
  <path class="flow" d="M3010 750 H3120"/><text class="guard" x="3032" y="731">[invalid]</text>
  <rect class="node" x="3100" y="315" width="245" height="92" rx="22"/>
  <text class="nodeText" x="3222" y="345"><tspan x="3222">Correct mark, comment,</tspan><tspan x="3222" dy="25">or justification</tspan></text>
  <path class="flow" d="M3222 705 V407"/>
  <path class="flow" d="M3100 361 H3070 V145 H2300 V190"/>
  <polygon class="decision" points="2920,865 2995,920 2920,975 2845,920"/>
  <text class="decisionText" x="2920" y="909"><tspan x="2920">More rubric</tspan><tspan x="2920" dy="22">criteria?</tspan></text>
  <path class="flow" d="M2920 810 V865"/><text class="guard" x="2938" y="842">[valid]</text>
  <path class="flow" d="M2845 920 H2720 V430 H2300 V275"/><text class="guard" x="2730" y="900">[more criteria]</text>
  <rect class="node" x="3080" y="870" width="190" height="84" rx="22"/>
  <text class="nodeText" x="3175" y="902"><tspan x="3175">Calculate</tspan><tspan x="3175" dy="25">total mark</tspan></text>
  <path class="flow" d="M2995 920 H3080"/><text class="guard" x="3010" y="900">[all criteria graded]</text>

  <!-- save draft -->
  <rect class="node" x="3350" y="190" width="190" height="82" rx="22"/>
  <text class="nodeText" x="3445" y="222"><tspan x="3445">Enter overall</tspan><tspan x="3445" dy="25">feedback</tspan></text>
  <rect class="node" x="3580" y="190" width="180" height="82" rx="22"/>
  <text class="nodeText" x="3670" y="222"><tspan x="3670">Select</tspan><tspan x="3670" dy="25">Save Draft</tspan></text>
  <path class="flow" d="M3270 912 H3310 V231 H3350"/><path class="flow" d="M3540 231 H3580"/>
  <rect class="node" x="3330" y="850" width="220" height="88" rx="22"/>
  <text class="nodeText" x="3440" y="881"><tspan x="3440">Store GradeRecord</tspan><tspan x="3440" dy="25">with DRAFT status</tspan></text>
  <rect class="node" x="3580" y="850" width="185" height="88" rx="22"/>
  <text class="nodeText" x="3672" y="881"><tspan x="3672">Display draft-saved</tspan><tspan x="3672" dy="25">confirmation</tspan></text>
  <path class="flow" d="M3670 272 V820 H3440 V850"/><path class="flow" d="M3550 894 H3580"/>
  <circle cx="3800" cy="894" r="30" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="3800" cy="894" r="18" fill="#111"/>
  <path class="flow" d="M3765 894 H3770"/>

  <!-- legend -->
  <rect x="2500" y="1360" width="31" height="31" rx="7" fill="#d9ebff" stroke="#2867ad" stroke-width="3"/>
  <text class="note" x="2545" y="1383">Blue – [Student name and ID] – Teaching Staff: Grade Submission</text>
  <text class="small" x="40" y="1383">Reference for recreation in Lucidchart • UML activity notation • replace bracketed student details before submission</text>
</svg>
